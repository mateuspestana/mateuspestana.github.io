<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - command not found</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0C0A">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  body{display:flex;min-height:100dvh;align-items:center;justify-content:center;padding:var(--pad-x)}
  .nf{max-width:60ch}
  .nf p{margin-bottom:.4rem}
  .nf .muted{color:var(--dim)}
  .nf .big{font-family:var(--display);font-weight:700;font-size:clamp(3rem,12vw,6rem);color:var(--text-strong);line-height:1;margin:1.2rem 0}
  .nf a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-dim)}
</style>
</head>
<body class="crt-off">
<div class="crt" aria-hidden="true"><div class="crt-scan"></div><div class="crt-vignette"></div></div>
<main class="nf">
  <p><span class="p-user" style="color:var(--accent)">matheus@pestana</span><span class="muted">:~$</span> cd <span class="muted" id="path">essa-pagina</span></p>
  <p class="muted">bash: cd: essa-pagina: No such file or directory</p>
  <p class="big">404</p>
  <p>a rota que você pediu não existe (ou foi apagada no redesign).</p>
  <p><a href="/">cd ~ &rarr; voltar para o início</a></p>
</main>
<script>document.getElementById('path').textContent=location.pathname.replace(/^\//,'')||'essa-pagina';</script>
</body>
</html>
